<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111a20"><title>DaRoo Reader</title><link rel="stylesheet" href="/assets/style.css"></head><body class="readerbody"><header class="readerbar"><a href="/" class="back">← DaRoo</a><div class="reader-title" id="book-title">Loading book…</div><div class="reader-tools"><button id="fullscreen" title="Fullscreen" aria-label="Fullscreen">⛶</button><button id="spread" title="Toggle two-page view" aria-label="Toggle two-page view">▣</button></div></header><main class="reader-main"><div class="reader-stage" id="stage" aria-live="polite"><div class="reader-page"><p>Loading preview…</p></div></div><div class="reader-controls"><button id="prev" aria-label="Previous page">← Previous</button><div><span id="counter">—</span><input id="seek" type="range" min="1" max="1" value="1" aria-label="Go to page"></div><button id="next" aria-label="Next page">Next →</button></div><p class="reader-note" id="reader-note">Preview material. Book is in development.</p></main><script src="/assets/reader.js" defer></script></body></html>
